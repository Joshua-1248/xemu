general:
  show_welcome:
    type: bool
    default: true
  updates:
    check:
      type: bool
      default: true
  screenshot_dir: string
  games_dir: string
  skip_boot_anim: bool
  # throttle_io: bool
  last_viewed_menu_index: integer
  user_token: string
  snapshots:
    shortcuts:
      f5: string
      f6: string
      f7: string
      f8: string
    filter_current_game: bool
  texture_dump_enabled:
    type: bool
    default: false
  texture_replace_enabled:
    type: bool
    default: false
  texture_dump_skip_replaced:
    type: bool
    default: true
  texture_dump_mipmaps:
    type: bool
    default: false
  # Empty = use <xemu data dir>/textures/<TITLEID>/{dumps,replacements}
  texture_dump_dir: string
  texture_replace_dir: string
  # ImGuiKey values (imgui.h, ImGuiKey_Tab = 512)
  texture_dump_toggle_key:
    type: integer
    default: 600 # ImGuiKey_Slash  ( / )
  texture_replace_toggle_key:
    type: integer
    default: 597 # ImGuiKey_Comma  ( , )
  texture_replace_reload_key:
    type: integer
    default: 599 # ImGuiKey_Period ( . )

  # Fast-forward controls.
  # 0 = Unlimited; 2..5 = fixed multiplier.
  fast_forward_multiplier:
    type: integer
    default: 3
  fast_forward_toggle_mode:
    type: bool
    default: false
  # Keep fast-forward audio near its original pitch by granular
  # time-compression instead of frequency-ratio resampling.
  fast_forward_preserve_pitch:
    type: bool
    default: false
  # Raw ImGuiKey value. Tab = 512.
  fast_forward_hotkey:
    type: integer
    default: 512

input:
  bindings:
    port1_driver: string
    port1: string
    port2_driver: string
    port2: string
    port3_driver: string
    port3: string
    port4_driver: string
    port4: string
  peripherals:
    port1:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port2:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port3:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port4:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
  gamecontrollerdb_path: string
  auto_bind:
    type: bool
    default: true
  # Deprecated: use 'enable_rumble' on the controller mapping settings instead
  allow_vibration:
    type: bool
    default: true
  background_input_capture: bool
  keyboard_controller_scancode_map:
    # Scancode reference : https://github.com/libsdl-org/SDL/blob/main/include/SDL_scancode.h
    a:
      type: integer
      default: 4 # a
    b:
      type: integer
      default: 5 # b
    x:
      type: integer
      default: 27 # x
    y:
      type: integer
      default: 28 # y
    dpad_left:
      type: integer
      default: 80 # left
    dpad_up:
      type: integer
      default: 82 # up
    dpad_right:
      type: integer
      default: 79 # right
    dpad_down:
      type: integer
      default: 81 # down
    back:
      type: integer
      default: 42 # backspace
    start:
      type: integer
      default: 40 # return
    white:
      type: integer
      default: 30 # 1
    black:
      type: integer
      default: 31 # 2
    lstick_btn:
      type: integer
      default: 32 # 3
    rstick_btn:
      type: integer
      default: 33 # 4
    guide:
      type: integer
      default: 34 # 5
    lstick_up:
      type: integer
      default: 8 # e
    lstick_left:
      type: integer
      default: 22 # s
    lstick_right:
      type: integer
      default: 9 # f
    lstick_down:
      type: integer
      default: 7 # d
    ltrigger:
      type: integer
      default: 26 # w
    rstick_up:
      type: integer
      default: 12 # i
    rstick_left:
      type: integer
      default: 13 # j
    rstick_right:
      type: integer
      default: 15 # l
    rstick_down:
      type: integer
      default: 14 # k
    rtrigger:
      type: integer
      default: 18 # w
  gamepad_mappings:
    type: array
    items:
      gamepad_id: string
      enable_rumble:
        type: bool
        default: true
      # steel_battalion_mapping:
      # ...
      controller_mapping:
        a:
          type: integer
          default: 0
        b:
          type: integer
          default: 1
        x:
          type: integer
          default: 2
        y:
          type: integer
          default: 3
        back:
          type: integer
          default: 4
        guide:
          type: integer
          default: 5
        start:
          type: integer
          default: 6
        lstick_btn:
          type: integer
          default: 7
        rstick_btn:
          type: integer
          default: 8
        lshoulder:
          type: integer
          default: 9
        rshoulder:
          type: integer
          default: 10
        dpad_up:
          type: integer
          default: 11
        dpad_down:
          type: integer
          default: 12
        dpad_left:
          type: integer
          default: 13
        dpad_right:
          type: integer
          default: 14
        axis_left_x:
          type: integer
          default: 0
        axis_left_y:
          type: integer
          default: 1
        axis_right_x:
          type: integer
          default: 2
        axis_right_y:
          type: integer
          default: 3
        axis_trigger_left:
          type: integer
          default: 4
        axis_trigger_right:
          type: integer
          default: 5
        invert_axis_left_x:
          type: bool
          default: false
        invert_axis_left_y:
          type: bool
          default: false
        invert_axis_right_x:
          type: bool
          default: false
        invert_axis_right_y:
          type: bool
          default: false

display:
  renderer:
    type: enum
    values: ["NULL", OPENGL, VULKAN]
    default: OPENGL
  vulkan:
    validation_layers: bool
    debug_shaders: bool
    assert_on_validation_msg: bool
    preferred_physical_device: string
  quality:
    surface_scale:
      type: integer
      default: 1
  filtering:
    type: enum
    values: [linear, nearest]
    default: linear
  window:
    fullscreen_on_startup: bool
    fullscreen_exclusive: bool
    startup_size:
      type: enum
      values: [last_used, 640x480, 720x480, 1280x720, 1280x800, 1280x960, 1920x1080, 2560x1440, 2560x1600, 2560x1920, 3840x2160]
      default: 1280x960
    last_width:
      type: integer
      default: 640
    last_height:
      type: integer
      default: 480
    vsync:
      type: bool
      default: true
  ui:
    show_menubar:
      type: bool
      default: true
    show_notifications:
      type: bool
      default: true
    hide_cursor:
      type: bool
      default: true
    use_animations:
      type: bool
      default: true
    fit:
      type: enum
      values: [center, scale, stretch]
      default: scale
    aspect_ratio:
      type: enum
      values: [native, auto, 4x3, 16x9]
      default: auto
    scale:
      type: float
      default: 1
    auto_scale:
      type: bool
      default: true
  debug:
    video:
      transparency:
        type: bool
        default: false
      x_pos:
        type: number
        default: 100.0
      y_pos:
        type: number
        default: 100.0
      x_winsize:
        type: number
        default: 600.0
      y_winsize:
        type: number
        default: 150.0
      advanced_tree_state:
        type: bool
        default: false
  setup_nvidia_profile:
    type: bool
    default: true

audio:
  # Source-level APU audio dumping/replacement. Static hardware voices are
  # supported first; streaming SSL voices remain on the original path until
  # the streaming reconstruction phase is implemented.
  dump_enabled:
    type: bool
    default: false
  dump_skip_replaced:
    type: bool
    default: true
  replace_enabled:
    type: bool
    default: false
  # Empty = <xemu data dir>/audio/<TITLEID>/{dumps,replacements}
  dump_dir: string
  replace_dir: string
  vp:
    num_workers:
      type: integer
      default: 0  # 0 = auto
  use_dsp: bool
  use_dsp_jit:
    type: bool
    default: false
  hrtf:
    type: bool
    default: true
  volume_limit:
    type: number
    default: 1

codes:
  # Master switch. Per-cheat enabled flags live in the cheat files, not here,
  # so turning this off stops everything without losing them.
  enable:
    type: bool
    default: true
  # Independent per kind, like texture_dump_dir / texture_replace_dir above.
  # Empty = <xemu data dir>/codes/cheats/ and <xemu data dir>/codes/patches/.
  # A set path is used as-is; no subfolder is appended.
  cheats_dir: string
  patches_dir: string
  # How often enabled codes are re-applied, in ms. Re-applying at the frame
  # rate is wasted work: a freeze only has to beat the game's own writes.
  interval_ms:
    type: integer
    default: 16

net:
  enable: bool
  backend:
    type: enum
    values: [nat, udp, pcap]
    default: nat
  pcap:
    netif: string
  udp:
    bind_addr:
      type: string
      default: 0.0.0.0:9368
    remote_addr:
      type: string
      default: 1.2.3.4:9368
  nat:
    forward_ports:
      type: array
      items:
        host: integer
        guest: integer
        protocol:
          type: enum
          values: [tcp, udp]
          default: tcp

sys:
  mem_limit:
    type: enum
    values: ['64', '128']
    default: '64'
  avpack:
    type: enum
    values: [scart, hdtv, vga, rfu, svideo, composite, none]
    default: hdtv
  files:
    bootrom_path: string
    flashrom_path: string
    eeprom_path: string
    hdd_path: string
    dvd_path: string

perf:
  hard_fpu:
    type: bool
    default: true
  cache_shaders:
    type: bool
    default: true
